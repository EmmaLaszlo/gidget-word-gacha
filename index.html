<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gidget's Word Gacha</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root{
  --pink-bg:#ffd3e8;
  --pink-deep:#ff9fc9;
  --pink-line:#e06fa8;
  --panel:#fff0f7;
  --ink:#4a2a3a;
  --biscuit:#e8cfa0;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--pink-bg);
  background-image:
    radial-gradient(circle at 15% 20%, #ffe6f2 0 6px, transparent 7px),
    radial-gradient(circle at 80% 15%, #ffe6f2 0 5px, transparent 6px),
    radial-gradient(circle at 60% 80%, #ffe6f2 0 4px, transparent 5px),
    radial-gradient(circle at 30% 70%, #ffe6f2 0 5px, transparent 6px);
  background-size: 100% 100%;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:18px 12px 40px;
  font-family:'VT323', monospace;
  color:var(--ink);
}

.wrap{
  max-width:420px;
  width:100%;
}

.title-card{
  background:var(--panel);
  border:4px solid var(--pink-line);
  border-radius:10px;
  box-shadow:0 6px 0 var(--pink-deep);
  padding:14px 12px;
  text-align:center;
  margin-bottom:14px;
}

.pixel{ font-family:'Press Start 2P', monospace; }

h1.pixel{
  font-size:13px;
  color:#c33d78;
  margin:0 0 6px;
  line-height:1.6;
  text-shadow:2px 2px 0 #ffffff;
}

.subtitle{
  font-size:16px;
  color:#a0567f;
  margin:0;
}

.streak-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}

.badge{
  font-family:'Press Start 2P', monospace;
  font-size:10px;
  background:#fff;
  border:2px solid var(--pink-line);
  border-radius:6px;
  padding:5px 8px;
  color:#c33d78;
}

.stage{
  background:linear-gradient(#fff0f7, #ffe0ef);
  border:4px solid var(--pink-line);
  border-radius:10px;
  box-shadow:0 6px 0 var(--pink-deep);
  padding:16px 10px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  overflow:hidden;
  min-height:230px;
}

.ground{
  position:absolute;
  bottom:0; left:0; right:0;
  height:34px;
  background:repeating-linear-gradient(90deg, #ffc3de 0 10px, #ffb0d3 10px 20px);
  border-top:3px dashed #e06fa8;
}

.dog-outer{
  transition:none;
  z-index:2;
  position:relative;
}

.word-ball{
  position:absolute;
  width:18px;height:18px;
  border-radius:50%;
  border:1.5px solid #c33d78;
  top:56%;
  left:50%;
  overflow:hidden;
  z-index:3;
  opacity:0;
  transform:translate(-50%,-50%) scale(0);
  transition: opacity 0.25s ease-out, transform 0.25s ease-out;
  pointer-events:none;
}
.word-ball.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
.word-ball .wb-top{ position:absolute; top:0; left:0; right:0; height:50%; }
.word-ball .wb-bot{ position:absolute; bottom:0; left:0; right:0; height:50%; background:#fff; }

.dog-bob{
  animation: bob 1.8s ease-in-out infinite;
}
@keyframes bob{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-5px); }
}

.dog-sprite{
  width:192px;
  height:192px;
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
  display:block;
  margin-bottom:2px;
  cursor:pointer;
  -webkit-touch-callout:none;
  user-select:none;
}

.dog-name{
  font-family:'Press Start 2P', monospace;
  font-size:9px;
  color:#a0567f;
  margin-top:2px;
  z-index:2;
}

.capsule-pop{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  width:46px;height:46px;
  border-radius:50%;
  z-index:3;
  pointer-events:none;
}
.capsule-pop.show{
  animation: capPop 0.55s ease-out forwards;
}
@keyframes capPop{
  0%{ transform:translate(-50%,-50%) scale(0); opacity:0; }
  50%{ transform:translate(-50%,-70%) scale(1.15); opacity:1; }
  100%{ transform:translate(-50%,-70%) scale(0); opacity:0; }
}

.fetch-btn{
  font-family:'Press Start 2P', monospace;
  font-size:11px;
  background:#ff8fbe;
  color:#fff;
  border:3px solid #c33d78;
  border-radius:8px;
  padding:12px 10px;
  width:100%;
  margin-top:14px;
  cursor:pointer;
  box-shadow:0 4px 0 #c33d78;
  letter-spacing:1px;
}
.fetch-btn:active{ transform:translateY(3px); box-shadow:none; }
.fetch-btn:disabled{ opacity:0.5; cursor:default; }

.status{
  text-align:center;
  font-size:16px;
  color:#8a3f66;
  margin-top:10px;
}

.capsules{
  display:flex;
  justify-content:space-between;
  gap:6px;
  margin-top:16px;
}

.capsule{
  flex:1;
  aspect-ratio:1/1;
  border-radius:50%;
  position:relative;
  cursor:default;
  border:2px solid #c33d78;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Press Start 2P', monospace;
  font-size:12px;
  box-shadow:0 3px 0 rgba(195,61,120,0.4);
}
.capsule .top{
  position:absolute; top:0; left:0; right:0; height:50%;
}
.capsule .bot{
  position:absolute; bottom:0; left:0; right:0; height:50%;
  background:#fff;
}
.capsule .glyph{ position:relative; z-index:2; color:#c33d78; }
.capsule.locked .top{ background:#d9c8d3; }
.capsule.locked .glyph{ color:#9a7d90; }
.capsule.unlocked{ cursor:pointer; }
.capsule.unlocked:hover{ transform:translateY(-2px); }

.footer-note{
  text-align:center;
  font-size:14px;
  color:#a0567f;
  margin-top:16px;
}

.dev-reset{
  display:block;
  text-align:center;
  font-size:11px;
  color:#c78aa8;
  text-decoration:underline;
  margin-top:8px;
  cursor:pointer;
  background:none;
  border:none;
  font-family:'VT323', monospace;
  width:100%;
}

/* modal */
.modal-bg{
  position:fixed; inset:0;
  background:rgba(80,20,50,0.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}
.modal-bg.open{ display:flex; }

.modal-card{
  background:#fff8fb;
  border:4px solid #c33d78;
  border-radius:12px;
  box-shadow:0 8px 0 #a03f6a;
  max-width:360px;
  width:100%;
  padding:20px 18px;
  text-align:center;
  animation: cardIn 0.3s ease-out;
}
@keyframes cardIn{
  0%{ transform:scale(0.7); opacity:0; }
  100%{ transform:scale(1); opacity:1; }
}

.pos-pill{
  font-family:'Press Start 2P', monospace;
  font-size:9px;
  background:#ffd3e8;
  color:#c33d78;
  display:inline-block;
  padding:4px 8px;
  border-radius:10px;
  margin-bottom:10px;
}

.modal-word{
  font-family:'Press Start 2P', monospace;
  font-size:20px;
  color:#c33d78;
  margin:4px 0 6px;
  word-break:break-word;
}

.modal-pron{
  font-size:17px;
  color:#a0567f;
  font-style:italic;
  margin-bottom:12px;
}

.modal-def{
  font-size:19px;
  color:#4a2a3a;
  margin-bottom:12px;
  line-height:1.35;
}

.modal-ex{
  font-size:17px;
  color:#8a3f66;
  font-style:italic;
  background:#ffeaf3;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:14px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:center;
}

.modal-btn{
  font-family:'Press Start 2P', monospace;
  font-size:10px;
  border:2px solid #c33d78;
  border-radius:6px;
  background:#fff;
  color:#c33d78;
  padding:8px 12px;
  cursor:pointer;
}
.modal-btn.primary{
  background:#ff8fbe;
  color:#fff;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="title-card">
    <h1 class="pixel">GIDGET'S<br>WORD GACHA</h1>
    <p class="subtitle">5 new words a day, fresh from the yard</p>
    <div class="streak-row">
      <div class="badge" id="streakBadge">🔥 0 DAY</div>
      <div class="badge" id="progressBadge">0 / 5</div>
    </div>
  </div>

  <div class="stage" id="stageEl">
    <div class="ground"></div>
    <div class="dog-outer" id="dogOuter">
      <div class="dog-bob">
        <img class="dog-sprite" id="dogSprite" alt="Gidget the maltipoo" draggable="false">
      </div>
      <div class="word-ball" id="wordBall">
        <div class="wb-top" id="wordBallTop"></div>
        <div class="wb-bot"></div>
      </div>
    </div>
    <div class="dog-name">GIDGET THE MALTIPOO</div>
    <div class="capsule-pop" id="capsulePop"></div>
  </div>

  <button class="fetch-btn" id="fetchBtn">🐾 SEND GIDGET TO FETCH A WORD</button>
  <div class="status" id="statusMsg">tap the button to start today's fetch!</div>

  <div class="capsules" id="capsuleRow"></div>

  <div class="footer-note" id="footerNote"></div>
  <button class="dev-reset" id="devResetBtn">reset today (testing)</button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal-card">
    <div class="pos-pill" id="modalPOS">NOUN</div>
    <div class="modal-word" id="modalWord">WORD</div>
    <div class="modal-pron" id="modalPron">/pronunciation/</div>
    <div class="modal-def" id="modalDef">definition</div>
    <div class="modal-ex" id="modalEx">"example sentence"</div>
    <div class="modal-actions">
      <button class="modal-btn" id="modalSpeak">🔊 HEAR IT</button>
      <button class="modal-btn primary" id="modalClose">GOT IT!</button>
    </div>
  </div>
</div>

/* WALK_FRAMES upload order was: [Walking_1, Walking_2b, Walking_1b, Walking_2_]
   Leaving uses her left-facing pair (1 / 2), returning uses her right-facing
   pair (1b / 2b) - no mirroring needed since these were drawn separately. */
const WALK_OUT_FRAMES = [WALK_FRAMES[0], WALK_FRAMES[3]];
const WALK_BACK_FRAMES = [WALK_FRAMES[2], WALK_FRAMES[1]];
const WALK_FRAME_MS = 230; // medium, stop-motion-ish cadence

let walkIntervalId = null;
let dogX = 0; // current translateX position in px, tracked so steps compound correctly

/* Moves the dog in fixed pixel steps, one step per frame swap, with NO css
   transition - each tick is a discrete jump (position + pose change together),
   which is what actually reads as a walk cycle instead of a smooth glide. */
function walkSteps(frames, totalPx, totalMs, onDone){
  const img = document.getElementById('dogSprite');
  const el = document.getElementById('dogOuter');
  el.style.transition = 'none';
  const steps = Math.max(1, Math.round(totalMs / WALK_FRAME_MS));
  const deltaPerStep = totalPx / steps;
  let frameIdx = 0;
  let stepCount = 0;
  img.src = frames[0];
  walkIntervalId = setInterval(() => {
    stepCount++;
    dogX += deltaPerStep;
    el.style.transform = 'translateX(' + Math.round(dogX) + 'px)';
    frameIdx = (frameIdx + 1) % frames.length;
    img.src = frames[frameIdx];
    if(stepCount >= steps){
      clearInterval(walkIntervalId);
      walkIntervalId = null;
      if(onDone) onDone();
    }
  }, WALK_FRAME_MS);
}
function stopWalking(){
  clearInterval(walkIntervalId);
  walkIntervalId = null;
}

function showWordBall(slot){
  document.getElementById('wordBallTop').style.background = CAPSULE_COLORS[slot % CAPSULE_COLORS.length];
  document.getElementById('wordBall').classList.add('show');
}
function hideWordBall(){
  document.getElementById('wordBall').classList.remove('show');
}

let currentPose = 'idle';
let fetchInProgress = false;
let idleTimer = null;
const IDLE_TO_SLEEP_MS = 25000;
const LICK_DURATION_MS = 1400;

function setDogPose(pose){
  const img = document.getElementById('dogSprite');
  const src = SPRITES[pose] || SPRITES.idle;
  img.src = src;
  currentPose = SPRITES[pose] ? pose : 'idle';
}

function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(!SPRITES.sleep) return; // no sleep pose drawn yet, skip
  idleTimer = setTimeout(() => {
    if(currentPose === 'idle' && !fetchInProgress) setDogPose('sleep');
  }, IDLE_TO_SLEEP_MS);
}

function handleDogTap(){
  if(fetchInProgress) return;
  if(currentPose === 'sleep'){
    setDogPose('idle');
    resetIdleTimer();
    return;
  }
  clearTimeout(idleTimer);
  setDogPose('lick');
  setTimeout(() => {
    setDogPose('idle');
    resetIdleTimer();
  }, LICK_DURATION_MS);
}

/* ---------------- deterministic daily selection ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seed){
  const rng = mulberry32(seed);
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const WORD_COUNT = WORDS.length; // 50
const GROUP_SIZE = 5;
const NUM_GROUPS = Math.floor(WORD_COUNT / GROUP_SIZE); // 10
const ORDER = seededShuffle([...Array(WORD_COUNT).keys()], 424242);

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function localDayIndex(d){
  const midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return Math.floor(midnight / 86400000);
}

function getTodayWords(){
  const now = new Date();
  const dayIdx = localDayIndex(now);
  const group = ((dayIdx % NUM_GROUPS) + NUM_GROUPS) % NUM_GROUPS;
  const ids = ORDER.slice(group * GROUP_SIZE, group * GROUP_SIZE + GROUP_SIZE);
  return ids.map(i => WORDS[i]);
}

function msUntilMidnight(){
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  return next.getTime() - now.getTime();
}
function fmtCountdown(ms){
  const total = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(total/3600);
  const m = Math.floor((total%3600)/60);
  const s = total%60;
  return pad(h)+':'+pad(m)+':'+pad(s);
}

/* ---------------- persistence ---------------- */
function loadState(){
  try{
    const raw = localStorage.getItem('wp_state');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveState(state){
  try{ localStorage.setItem('wp_state', JSON.stringify(state)); }
  catch(e){ console.error('storage save failed', e); }
}

/* ---------------- app state ---------------- */
let state = { date:'', pulledSlots:[], streak:0, lastCompleteDate:'' };
let todayWords = [];
const CAPSULE_COLORS = ['#ffb703','#8ecae6','#ffafcc','#a7e8a0','#c9b6f2'];

function yesterdayKey(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return dateKey(d);
}

async function initState(){
  const today = dateKey(new Date());
  let loaded = await loadState();
  if(!loaded || loaded.date !== today){
    let streak = loaded ? loaded.streak : 0;
    let lastCompleteDate = loaded ? loaded.lastCompleteDate : '';
    const yKey = yesterdayKey();
    if(lastCompleteDate && lastCompleteDate !== yKey && lastCompleteDate !== today){
      streak = 0; // missed a day, streak broken
    }
    state = { date: today, pulledSlots: [], streak, lastCompleteDate };
    await saveState(state);
  } else {
    state = loaded;
  }
}

async function markSlotPulled(slot){
  if(state.pulledSlots.includes(slot)) return;
  state.pulledSlots.push(slot);
  if(state.pulledSlots.length === GROUP_SIZE && state.lastCompleteDate !== state.date){
    const yKey = yesterdayKey();
    state.streak = (state.lastCompleteDate === yKey) ? state.streak + 1 : 1;
    state.lastCompleteDate = state.date;
  }
  await saveState(state);
}

/* ---------------- rendering ---------------- */
function renderCapsules(){
  const row = document.getElementById('capsuleRow');
  row.innerHTML = '';
  for(let i = 0; i < GROUP_SIZE; i++){
    const unlocked = state.pulledSlots.includes(i);
    const cap = document.createElement('div');
    cap.className = 'capsule ' + (unlocked ? 'unlocked' : 'locked');
    const top = document.createElement('div');
    top.className = 'top';
    if(unlocked) top.style.background = CAPSULE_COLORS[i % CAPSULE_COLORS.length];
    const bot = document.createElement('div');
    bot.className = 'bot';
    const glyph = document.createElement('div');
    glyph.className = 'glyph';
    glyph.textContent = unlocked ? '★' : '?';
    cap.appendChild(top); cap.appendChild(bot); cap.appendChild(glyph);
    if(unlocked){
      cap.addEventListener('click', () => {
        if(fetchInProgress) return; // don't interrupt a fetch in progress
        openModal(todayWords[i]);
      });
    }
    row.appendChild(cap);
  }
  document.getElementById('progressBadge').textContent = state.pulledSlots.length + ' / ' + GROUP_SIZE;
  document.getElementById('streakBadge').textContent = '🔥 ' + state.streak + ' DAY' + (state.streak === 1 ? '' : 'S');
}

function updateStatusAndButton(){
  const btn = document.getElementById('fetchBtn');
  const statusEl = document.getElementById('statusMsg');
  const footer = document.getElementById('footerNote');
  const done = state.pulledSlots.length >= GROUP_SIZE;
  if(done){
    btn.disabled = true;
    btn.textContent = '✅ ALL FETCHED FOR TODAY';
    statusEl.textContent = 'nice! Gidget is taking a nap until tomorrow.';
  } else {
    btn.disabled = fetchInProgress;
    btn.textContent = '🐾 SEND GIDGET TO FETCH A WORD';
    const left = GROUP_SIZE - state.pulledSlots.length;
    statusEl.textContent = left + ' word' + (left === 1 ? '' : 's') + ' left to fetch today';
  }
  updateFooterCountdown();
}

function updateFooterCountdown(){
  const footer = document.getElementById('footerNote');
  footer.textContent = 'new set of 5 words in ' + fmtCountdown(msUntilMidnight());
}

let modalWord = null;

function openModal(word){
  modalWord = word;
  document.getElementById('modalPOS').textContent = word.p.toUpperCase();
  document.getElementById('modalWord').textContent = word.w.toUpperCase();
  document.getElementById('modalPron').textContent = '/ ' + word.pr + ' /';
  document.getElementById('modalDef').textContent = word.d;
  document.getElementById('modalEx').textContent = '“' + word.e + '”';
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

function speakWord(text){
  try{
    if('speechSynthesis' in window){
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);
    }
  }catch(e){ /* silently ignore if unavailable */ }
}

/* ---------------- fetch action ---------------- */
function nextUnpulledSlot(){
  for(let i = 0; i < GROUP_SIZE; i++){
    if(!state.pulledSlots.includes(i)) return i;
  }
  return -1;
}

const WALK_OUT_MS = 900;   // medium walking pace off-screen
const WALK_BACK_MS = 900;  // medium walking pace back to center
const BALL_HOLD_MS = 1100; // how long she holds the word-ball after arriving home

/* Distance needed so her whole sprite clears the stage's edge, however wide
   the stage happens to be rendered (phone, tablet, desktop window, etc). */
function getOffscreenDistance(){
  const stage = document.getElementById('stageEl');
  const dogOuter = document.getElementById('dogOuter');
  const stageWidth = stage.clientWidth;
  const dogWidth = dogOuter.offsetWidth || 192;
  return (stageWidth / 2) + (dogWidth / 2) + 24; // +24px buffer past the edge
}

async function doFetch(){
  if(fetchInProgress) return; // one fetch at a time
  const slot = nextUnpulledSlot();
  if(slot === -1) return;
  fetchInProgress = true;
  clearTimeout(idleTimer);
  const btn = document.getElementById('fetchBtn');
  btn.disabled = true;

  dogX = 0; // she always starts fetches from home position
  const offscreenPx = getOffscreenDistance();

  walkSteps(WALK_OUT_FRAMES, -offscreenPx, WALK_OUT_MS, () => {
    // she's off-screen: swap to her right-facing pair and grab the word
    showWordBall(slot);
    walkSteps(WALK_BACK_FRAMES, offscreenPx, WALK_BACK_MS, () => {
      setDogPose('carry_pig'); // home, still holding the word-ball

      setTimeout(async () => {
        hideWordBall();
        const pop = document.getElementById('capsulePop');
        pop.style.background = 'linear-gradient(180deg, ' + CAPSULE_COLORS[slot % CAPSULE_COLORS.length] + ' 50%, #fff 50%)';
        pop.classList.remove('show');
        void pop.offsetWidth; // restart animation
        pop.classList.add('show');

        setTimeout(async () => {
          await markSlotPulled(slot);
          renderCapsules();
          updateStatusAndButton();
          openModal(todayWords[slot]);
        }, 480);
      }, BALL_HOLD_MS);
    });
  });
}

/* ---------------- init ---------------- */
async function init(){
  setDogPose('idle');
  todayWords = getTodayWords();
  await initState();
  renderCapsules();
  updateStatusAndButton();
  resetIdleTimer();

  document.getElementById('fetchBtn').addEventListener('click', doFetch);
  document.getElementById('dogSprite').addEventListener('click', handleDogTap);
  document.getElementById('modalClose').addEventListener('click', () => {
    closeModal();
    fetchInProgress = false;
    setDogPose('idle');
    resetIdleTimer();
    updateStatusAndButton();
  });
  document.getElementById('modalSpeak').addEventListener('click', () => {
    // speak the normal-case word; some voices spell out ALL-CAPS text letter by letter
    if(modalWord) speakWord(modalWord.w);
  });
  document.getElementById('modalBg').addEventListener('click', (e) => {
    if(e.target.id === 'modalBg'){
      closeModal();
      fetchInProgress = false;
      setDogPose('idle');
      resetIdleTimer();
      updateStatusAndButton();
    }
  });
  // testing-only reset: hidden unless the page is opened with ?dev in the URL
  const devResetBtn = document.getElementById('devResetBtn');
  if(!new URLSearchParams(location.search).has('dev')) devResetBtn.style.display = 'none';
  devResetBtn.addEventListener('click', () => {
    try{ localStorage.removeItem('wp_state'); }catch(e){ /* nothing stored yet */ }
    location.reload();
  });

  setInterval(tick, 1000);
}

/* Runs every second: updates the countdown, and swaps in the new day's words
   at midnight if the page has been left open. */
async function tick(){
  updateFooterCountdown();
  if(fetchInProgress || state.date === dateKey(new Date())) return;
  todayWords = getTodayWords();
  await initState();
  renderCapsules();
  updateStatusAndButton();
}

init();
</script>
